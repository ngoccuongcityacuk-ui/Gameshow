    $("#backHome").onclick=()=>go('home');
    $("#blNew").onclick=()=>{sfx.select();battle();};
    $("#blSetup").onclick=()=>setup();
  }
  function initPool(){const P=pool();const seen=new Set();poolW=shuffle(P.vocab).filter(w=>{if(seen.has(w.en))return false;seen.add(w.en);return true;}).map(w=>({en:w.en,vi:w.vi}));called=[];current=null;curShown=false;showList=false;genCards();}
  function genCards(){cards=[];const k=Math.min(size,poolW.length);for(let c=0;c<nCards;c++)cards.push(sample(poolW,k));}
  function head(){return `<div class="stagehead"><div class="ttl"><div class="mi">🔢</div><div><h2>Lô tô nghe</h2><div class="sub">Người gọi đọc từ · học sinh nghe & đánh dấu</div></div></div><div class="spacer"></div><button class="btn sec" id="backHome">⟵ Trang chủ</button></div>`;}
  function tabsHTML(){return `<div class="bg-tabs"><button class="bg-tab ${tab==='call'?'on':''}" data-tab="call">🔊 Người gọi</button><button class="bg-tab ${tab==='cards'?'on':''}" data-tab="cards">🎴 Thẻ lô tô</button></div>`;}
  function render(){
    stage.innerHTML=`<div class="bg-wrap">${head()}${tabsHTML()}<div id="bgBody"></div></div>`;
    $("#backHome").onclick=()=>go('home');
    stage.querySelectorAll('.bg-tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sfx.tick();render();});
    if(tab==='call')renderCall(); else renderCards();
  }
  function renderCall(){
    const remain=poolW.length-called.length;
    $("#bgBody").innerHTML=`
      <div class="card" style="padding:24px;text-align:center">
        <div class="eyebrow" style="color:var(--acc)">Từ vừa gọi</div>
        <div class="bg-current">${current?(curShown?esc(current.en):'🔊 ? ? ?'):'—'}</div>
        <div class="muted" style="min-height:18px;font-weight:600">${current&&curShown?esc(current.vi):(current?'(đã đọc — bấm 👁️ để hiện chữ kiểm tra)':'')}</div>
        <div class="rowbtns center mt16" style="justify-content:center">
          <button class="btn" id="bgCall" ${remain<=0?'disabled':''}>🔊 Gọi từ tiếp theo</button>
          <button class="btn sec" id="bgRepeat" ${current?'':'disabled'}>🔁 Đọc lại</button>
          <button class="btn sec" id="bgShow">${curShown?'🙈 Ẩn chữ':'👁️ Hiện chữ'}</button>
        </div>
        <div class="muted mt8" style="font-size:12.5px">Đã gọi <b>${called.length}</b>/${poolW.length} từ · còn ${remain}</div>
      </div>
      <div class="center mt16"><button class="cw-meanbtn" id="bgToggleList">${showList?'Ẩn':'Hiện'} danh sách đã gọi (để kiểm tra Lô tô)</button></div>
      <div id="bgList" ${showList?'':'hidden'}></div>
      <div class="center mt16"><button class="btn sec" id="bgReset">↺ Ván mới (gọi lại từ đầu)</button></div>`;
    renderList();
    $("#bgCall").onclick=callNext;
    $("#bgRepeat").onclick=()=>{if(current)speakW(current.en);};
    $("#bgShow").onclick=()=>{curShown=!curShown;renderCall();};
    $("#bgToggleList").onclick=()=>{showList=!showList;renderCall();};
    $("#bgReset").onclick=()=>{called=[];current=null;curShown=false;genCards();sfx.select();renderCall();};
  }
  function renderList(){const el=$("#bgList");if(!el)return;el.innerHTML=`<div class="bg-called">${called.length?called.map(w=>`<span class="bg-chip">${esc(w.en)}</span>`).join(''):'<span class="muted">Chưa gọi từ nào.</span>'}</div>`;}
  function callNext(){const left=poolW.filter(w=>!called.includes(w));if(!left.length){toast('Đã gọi hết từ!');return;}current=rpick(left);called.push(current);curShown=false;sfx.reveal();speakW(current.en);renderCall();}
  function speakW(t){ if(!speak(t,0.82)){curShown=true;} }
  function renderCards(){
    const cols=size===9?3:4;
    $("#bgBody").innerHTML=`<div class="center muted" style="font-weight:700;font-size:13px;margin-bottom:8px">Mỗi học sinh/đội chép MỘT thẻ khác nhau, rồi sang tab “Người gọi”.</div>
      <div class="bg-cards">${cards.map((c,ci)=>`<div class="bg-card"><div class="bg-card-h">🎴 Thẻ ${ci+1}</div><div class="bg-grid" style="grid-template-columns:repeat(${cols},1fr)">${c.map(w=>`<div class="bg-sq">${esc(w.en)}</div>`).join('')}</div></div>`).join('')}</div>
      <div class="center mt16"><button class="btn" id="bgRegen">🔄 Tạo thẻ mới</button> <button class="btn sec" id="bgToCall">🔊 Sang Người gọi</button></div>`;
    $("#bgRegen").onclick=()=>{genCards();sfx.select();renderCards();};
    $("#bgToCall").onclick=()=>{tab='call';render();};
  }
  return {start};
})();

/* ====================== PREPARE MONOPOLY ====================== */
const MN=(function(){
  const GROUPS=[
    {name:'Thiên nhiên',color:'#48d884'},{name:'Du lịch',color:'#ffa74a'},{name:'Trường học',color:'#6a9bff'},
    {name:'Thể thao',color:'#fb6767'},{name:'Thành phố',color:'#f6c945'},{name:'Phim ảnh',color:'#ec72f5'},{name:'Ẩm thực',color:'#2fe0d6'}
  ];
  const PROPDEF=[
    {name:'Rainforest',g:0,price:60},{name:'Waterfall',g:0,price:60},{name:'Volcano',g:0,price:100},
    {name:'Airport',g:1,price:120},{name:'Hotel',g:1,price:120},{name:'Beach',g:1,price:140},
    {name:'Classroom',g:2,price:160},{name:'Library',g:2,price:160},{name:'Canteen',g:2,price:180},
    {name:'Stadium',g:3,price:200},{name:'Gym',g:3,price:200},{name:'Pool',g:3,price:220},
    {name:'Skyscraper',g:4,price:240},{name:'Mall',g:4,price:240},{name:'Station',g:4,price:260},
    {name:'Cinema',g:5,price:280},{name:'Studio',g:5,price:300},
    {name:'Restaurant',g:6,price:320},{name:'Bakery',g:6,price:320},{name:'Market',g:6,price:350}
  ];
  const DICE=['','⚀','⚁','⚂','⚃','⚄','⚅'];
  let spaces=[],lastDice=0;
  function start(){ if(!requireUnits())return; setAccent('mn');
    TEAMS.setupUI({emoji:'🏠',title:'Prepare Monopoly',sub:'Lập đội — trả lời đúng để mua nhà',cta:'🏠 Bắt đầu chơi',wrap:'mn-wrap',start:()=>{
      TEAMS.list.forEach(t=>{t.money=1500;t.pos=0;t.skip=false;}); TEAMS.active=0; lastDice=0; spaces=buildSpaces(); phaseRoll();
    }});
  }
  function ringPos(i){ if(i<=6)return[0,i]; if(i<=12)return[i-6,6]; if(i<=18)return[6,6-(i-12)]; return[6-(i-18),0]; }
  function buildSpaces(){
    const sp=new Array(24);
    sp[0]={type:'go',name:'XUẤT PHÁT',emoji:'🏁'}; sp[6]={type:'chance',name:'Cơ hội',emoji:'❓'};
    sp[12]={type:'park',name:'Bãi đỗ xe',emoji:'🅿️'}; sp[18]={type:'jail',name:'Vào tù',emoji:'⛔'};
    let pi=0;
    for(let i=0;i<24;i++){ if(sp[i])continue; const p=PROPDEF[pi++]; sp[i]={type:'prop',name:p.name,group:GROUPS[p.g].name,color:GROUPS[p.g].color,price:p.price,rent:Math.round(p.price*0.2),owner:-1}; }
    for(let i=0;i<24;i++){const[r,c]=ringPos(i);sp[i].idx=i;sp[i].r=r;sp[i].c=c;}
    return sp;
  }
  function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
  function head(s){return `<div class="stagehead"><div class="ttl"><div class="mi">🏠</div><div><h2>Prepare Monopoly</h2><div class="sub">${esc(s)}</div></div></div><div class="spacer"></div><button class="btn sec" id="backHome">⟵ Trang chủ</button></div>`;}
  function tokens(i){return TEAMS.list.map(t=>t.pos===i?`<span class="mn-tok" style="background:${t.c[0]}"></span>`:'').join('');}
  function cellHTML(i){
    const s=spaces[i],style=`grid-row:${s.r+1};grid-column:${s.c+1}`;
    if(s.type!=='prop')return `<div class="mn-cell corner" style="${style}"><div class="cemoji">${s.emoji}</div><div class="cname">${esc(s.name)}</div><div class="mn-tokens">${tokens(i)}</div></div>`;
    const owned=s.owner>=0?`<div class="owned" style="--own:${TEAMS.list[s.owner].c[0]}"></div>`:'';
    return `<div class="mn-cell" style="${style}">${owned}<div class="cbar" style="background:${s.color}"></div><div class="cname">${esc(s.name)}</div><div class="cprice">${s.price}đ</div><div class="mn-tokens">${tokens(i)}</div></div>`;
  }
  function boardHTML(){
    let c='';for(let i=0;i<24;i++)c+=cellHTML(i);
    c+=`<div class="mn-center"><div style="font-size:26px">🏠</div><div class="lg">MONOPOLY</div><div class="mn-dice">${lastDice?DICE[lastDice]:'🎲'}</div></div>`;
    return `<div class="mn-board">${c}</div>`;
  }
  function mnScore(){
    return `<div class="scoreboard">${TEAMS.list.map((t,i)=>{const np=spaces.filter(s=>s.owner===i).length;
      return `<div class="team ${i===TEAMS.active?'active':''}">
        <div class="tp" style="background:linear-gradient(90deg,${t.c[0]},${t.c[1]})"></div>
        <div class="nm">${i===TEAMS.active?'🎲 ':''}<span class="mn-tok" style="display:inline-block;vertical-align:-1px;background:${t.c[0]}"></span> ${esc(t.name)}</div>
        <div class="sc tnum" style="font-size:21px">💰${t.money}</div>
        <div class="muted" style="font-size:12px;font-weight:700">🏠 ${np} nhà</div>
      </div>`;}).join('')}</div>`;
  }
  function view(action){
    const t=TEAMS.list[TEAMS.active];
    stage.innerHTML=`<div class="mn-wrap">${head('Lượt của '+t.name+' · 💰 '+t.money+'đ')}${mnScore()}${boardHTML()}<div id="mnAction">${action||''}</div></div>`;
    $("#backHome").onclick=()=>go('home');
  }
  const letters=['A','B','C','D'];
  function mnQ(){return drawTyped(MIX.fast,1)[0];}
  function ansHTML(q){return q.opts.map((o,i)=>`<div class="ans" style="cursor:default"><span class="lt" style="color:var(--acc);background:rgba(155,108,255,.16);border-color:var(--acc)">${letters[i]}</span><span>${o}</span></div>`).join('');}
  function revealAns(q){const a=[...stage.querySelectorAll('.ans')];if(a[q.a])a[q.a].classList.add('correct');sfx.reveal();}
  function whyHTML(q){return q.why?`<div class="phone-pop" style="border-color:var(--acc);max-width:560px;margin:8px auto 10px">💡 ${q.why}</div>`:'';}
  function phaseRoll(){
    stopSpeak();
    const t=TEAMS.list[TEAMS.active];
    if(t.skip){t.skip=false; view(`<div class="qbox" style="text-align:center;border-color:var(--acc)"><div class="qtext">⛔ ${esc(t.name)} đang trong tù — mất lượt này!</div></div><div class="center mt16"><button class="btn" id="nx">➜ Đội tiếp theo</button></div>`);$("#nx").onclick=nextTeam;return;}
    view(`<div class="center"><button class="btn" id="roll" style="font-size:19px;padding:16px 32px">🎲 ${esc(t.name)} tung xúc xắc</button></div><div class="center mt16"><button class="btn sec" id="end">🏆 Chung cuộc</button></div>`);
    $("#roll").onclick=doRoll; $("#end").onclick=endGame;
  }
  function doRoll(){
    const t=TEAMS.list[TEAMS.active]; const d=1+rint(6); lastDice=d; sfx.reveal();
    let np=t.pos+d; if(np>=24){np-=24;t.money+=200;toast(esc(t.name)+' qua Xuất phát +200đ');}
    t.pos=np; resolve(np);
  }
  function msgAction(msg,moneyChanged){
    view(`<div class="qbox" style="text-align:center;border-color:var(--acc);box-shadow:0 0 0 4px rgba(155,108,255,.08),var(--shadow)"><div class="qtext">${msg}</div></div><div class="center mt16"><button class="btn" id="nx">➜ Lượt tiếp theo</button></div>`);
    $("#nx").onclick=nextTeam;
  }
  function resolve(pos){
    const s=spaces[pos],t=TEAMS.list[TEAMS.active];
    if(s.type==='go'){t.money+=200;msgAction('🏁 Dừng ngay Xuất phát — nhận thêm <b>200đ</b>!');return;}
    if(s.type==='park'){msgAction('🅿️ Bãi đỗ xe — nghỉ chân, không có gì xảy ra.');return;}
    if(s.type==='jail'){t.skip=true;sfx.wrong();msgAction('⛔ Vào tù! '+esc(t.name)+' sẽ <b>mất lượt kế tiếp</b>.');return;}
    if(s.type==='chance'){chance();return;}
    if(s.owner<0)buyFlow(s);
    else if(s.owner===TEAMS.active)msgAction('🏠 <b>'+esc(s.name)+'</b> đã là nhà của đội bạn. Nghỉ chân thôi!');
    else rentFlow(s);
  }
  function buyFlow(s){
    const q=mnQ();
    view(`<div class="qbox" style="border-color:${s.color};box-shadow:0 0 0 4px ${hexA(s.color,.12)},var(--shadow)">
        <div class="qnum" style="color:${s.color}">🏠 ${esc(s.name)} · ${esc(s.group)} · Giá ${s.price}đ — trả lời ĐÚNG để MUA</div>${audioPromptHTML(q)}</div>
      <div class="answers${wideCls(q)}">${ansHTML(q)}</div>
      <div class="center mt16"><button class="btn" id="rev">👁️ Hiện đáp án</button></div><div id="jd"></div>`);
    bindAudio(q);
    $("#rev").onclick=()=>{revealAns(q);$("#rev").style.display='none';const t=TEAMS.list[TEAMS.active];const afford=t.money>=s.price;
      $("#jd").innerHTML=whyHTML(q)+`<div class="award"><button data-ok="1" style="border-color:var(--good)">✅ Đúng → Mua (-${s.price}đ)</button><button data-ok="0" style="border-color:var(--bad)">❌ Sai (không mua)</button></div>${afford?'':'<div class="center muted mt8" style="font-weight:700">⚠️ Đội không đủ tiền để mua ô này.</div>'}`;
      $("#jd").querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='1';
        if(ok&&afford){t.money-=s.price;s.owner=TEAMS.active;sfx.correct();confetti();toast(esc(t.name)+' mua '+esc(s.name)+'!');}
        else if(ok){sfx.wrong();toast('Trả lời đúng nhưng không đủ tiền!');}
        else sfx.tick();
        nextTeam();});
    };
  }
  function rentFlow(s){
    const owner=TEAMS.list[s.owner],t=TEAMS.list[TEAMS.active],half=Math.round(s.rent/2),q=mnQ();
    view(`<div class="qbox" style="border-color:${s.color};box-shadow:0 0 0 4px ${hexA(s.color,.12)},var(--shadow)">
        <div class="qnum" style="color:${s.color}">💸 ${esc(s.name)} là nhà của ${esc(owner.name)} · thuê ${s.rent}đ — trả lời ĐÚNG để giảm còn ${half}đ</div>${audioPromptHTML(q)}</div>
      <div class="answers${wideCls(q)}">${ansHTML(q)}</div>
      <div class="center mt16"><button class="btn" id="rev">👁️ Hiện đáp án</button></div><div id="jd"></div>`);
    bindAudio(q);
    $("#rev").onclick=()=>{revealAns(q);$("#rev").style.display='none';
      $("#jd").innerHTML=whyHTML(q)+`<div class="award"><button data-ok="1" style="border-color:var(--good)">✅ Đúng (trả ${half}đ)</button><button data-ok="0" style="border-color:var(--bad)">❌ Sai (trả ${s.rent}đ)</button></div>`;
      $("#jd").querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const pay=b.dataset.ok==='1'?half:s.rent;t.money-=pay;owner.money+=pay;sfx[b.dataset.ok==='1'?'correct':'wrong']();toast(esc(t.name)+' trả '+pay+'đ cho '+esc(owner.name));nextTeam();});
    };
  }
  function chance(){
    const q=mnQ(),bonus=100+rint(4)*50,t=TEAMS.list[TEAMS.active];
    view(`<div class="qbox" style="border-color:var(--acc);box-shadow:0 0 0 4px rgba(155,108,255,.1),var(--shadow)">
        <div class="qnum" style="color:var(--acc)">❓ CƠ HỘI — trả lời ĐÚNG để nhận ${bonus}đ</div>${audioPromptHTML(q)}</div>
      <div class="answers${wideCls(q)}">${ansHTML(q)}</div>
      <div class="center mt16"><button class="btn" id="rev">👁️ Hiện đáp án</button></div><div id="jd"></div>`);
    bindAudio(q);
    $("#rev").onclick=()=>{revealAns(q);$("#rev").style.display='none';
      $("#jd").innerHTML=whyHTML(q)+`<div class="award"><button data-ok="1" style="border-color:var(--good)">✅ Đúng (+${bonus}đ)</button><button data-ok="0" style="border-color:var(--bad)">❌ Sai (0đ)</button></div>`;
      $("#jd").querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{if(b.dataset.ok==='1'){t.money+=bonus;sfx.correct();confetti();toast(esc(t.name)+' +'+bonus+'đ');}else sfx.tick();nextTeam();});
    };
  }
  function nextTeam(){ stopSpeak(); TEAMS.active=(TEAMS.active+1)%TEAMS.list.length; phaseRoll(); }
  function netWorth(i){return TEAMS.list[i].money+spaces.filter(s=>s.owner===i).reduce((a,s)=>a+s.price,0);}
  function endGame(){ stopSpeak();confetti();sfx.win();
    const rank=TEAMS.list.map((t,i)=>({t,i,net:netWorth(i),np:spaces.filter(s=>s.owner===i).length})).sort((a,b)=>b.net-a.net);
    stage.innerHTML=`<div class="mn-wrap">${head('Chung cuộc — xếp theo tổng tài sản')}<div class="result card" style="padding:28px;max-width:640px">
      <div class="emoji" style="font-size:50px">🏆</div><div class="eyebrow">Chung cuộc</div><div class="big">${esc(rank[0].t.name)} giàu nhất!</div>
      <div class="mt16" style="display:flex;flex-direction:column;gap:9px">
      ${rank.map((r,k)=>`<div style="display:flex;align-items:center;gap:11px;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:12px;padding:11px 15px">
        <span class="tnum" style="font-size:20px;width:28px">${['🥇','🥈','🥉'][k]||(k+1)}</span>
        <span style="width:10px;height:26px;border-radius:5px;background:linear-gradient(180deg,${r.t.c[0]},${r.t.c[1]})"></span>
        <b style="flex:1;text-align:left">${esc(r.t.name)}</b><span class="muted" style="font-size:12px">💰${r.t.money} · 🏠${r.np}</span>
        <span class="tnum" style="font-size:22px;font-weight:700;color:var(--acc);margin-left:10px">${r.net}</span></div>`).join('')}
      </div>
      <div class="center" style="margin-top:20px"><button class="btn" id="again">🔄 Chơi lại</button> <button class="btn sec" id="hm">Trang chủ</button></div></div></div>`;
    $("#again").onclick=()=>start(); $("#hm").onclick=()=>go('home');
  }
  return {start};
})();

/* ---------------- boot ---------------- */
go('home');
</script>
