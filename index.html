<title>Prepare Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* ===== Prepare Arena — classroom game show for Prepare A2 Level 3 =====
   Layout: single dark "TV studio" stage; one screen rendered at a time into #stage.
   Theme: committed single dark world (stage lights); every colour is an explicit token. */
:root{
  color-scheme: dark;
  --bg:#070b18;
  --bg-2:#0c1230;
  --panel:#141b38;
  --panel-2:#1b2447;
  --panel-3:#232e58;
  --ink:#f4f7ff;
  --ink-2:#c3ccee;
  --ink-3:#8793c0;
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  /* mode accents */
  --gold:#f6c945;      --gold-2:#ffad33;   --gold-ink:#1c1402;
  --teal:#2fe0d6;      --teal-2:#22b6e6;   --teal-ink:#021715;
  --mag:#ec72f5;       --mag-2:#b14bff;    --mag-ink:#1a0320;
  --indigo:#7c8cff;
  /* semantic */
  --good:#36d08a;      --good-2:#1f9e63;
  --bad:#fb6767;       --bad-2:#c43a3a;
  --warn:#ffce52;
  /* dynamic accent (set per mode) */
  --acc:var(--gold); --acc-2:var(--gold-2); --acc-ink:var(--gold-ink);
  --radius:20px;
  --shadow:0 26px 60px -30px rgba(0,0,0,.85);
  --font-d:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-b:'Be Vietnam Pro',ui-sans-serif,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  font-family:var(--font-b);
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 50% -8%, rgba(124,140,255,.20), transparent 60%),
    radial-gradient(900px 600px at 12% 108%, rgba(236,114,245,.12), transparent 60%),
    radial-gradient(900px 600px at 90% 112%, rgba(47,224,214,.12), transparent 60%),
    linear-gradient(180deg,var(--bg-2),var(--bg) 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.wrap{
  width:100%;max-width:1060px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:16px 60px;
}
/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:10px 0;margin-bottom:6px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:39;background:var(--bg-2)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.brand .logo{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:conic-gradient(from 210deg,var(--gold),var(--mag),var(--teal),var(--gold));
  box-shadow:0 8px 20px -6px rgba(246,201,69,.5);font-size:22px;
}
.brand b{font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:.01em;line-height:1;display:block}
.brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin-top:2px}
.topbar .spacer{flex:1}
.pillbtn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--panel-2);border:1.5px solid var(--line-2);color:var(--ink-2);
  font-family:var(--font-b);font-weight:700;font-size:13.5px;
  padding:9px 14px;border-radius:12px;transition:.15s;white-space:nowrap;
}
.pillbtn:hover{border-color:var(--acc);color:var(--ink);transform:translateY(-1px)}
.pillbtn.ghost{background:transparent}
.icobtn{
  width:42px;height:42px;border-radius:12px;flex:none;cursor:pointer;display:grid;place-items:center;
  background:var(--panel-2);border:1.5px solid var(--line-2);color:var(--ink-2);font-size:18px;transition:.15s;
}
.icobtn:hover{border-color:var(--acc);color:var(--ink)}
/* ---------- generic ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  font-family:var(--font-b);font-weight:800;font-size:16px;border:none;border-radius:14px;
  padding:14px 22px;color:var(--acc-ink);
  background:linear-gradient(135deg,var(--acc),var(--acc-2));
  box-shadow:0 14px 30px -14px var(--acc);transition:.15s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(0)}
.btn.sec{background:var(--panel-2);color:var(--ink);border:1.5px solid var(--line-2);box-shadow:none}
.btn.sec:hover{border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;margin:0}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--font-d)}
[hidden]{display:none!important}
/* ---------- HOME ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:30px 26px 26px;margin-bottom:22px;
  background:
    radial-gradient(520px 260px at 82% -30%, rgba(246,201,69,.28), transparent 65%),
    radial-gradient(420px 280px at -5% 120%, rgba(236,114,245,.26), transparent 62%),
    linear-gradient(135deg,#1a2350,#121934);
  border:1.5px solid var(--line-2);box-shadow:var(--shadow);
}
.hero h1{font-size:clamp(30px,7.5vw,50px);line-height:1.02;margin:10px 0 10px}
.hero h1 .sp{background:linear-gradient(120deg,var(--gold),var(--mag) 55%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;max-width:620px;color:var(--ink-2);font-size:15.5px;font-weight:500}
.hero .spotlight{position:absolute;inset:0;pointer-events:none;background:conic-gradient(from 120deg at 78% -10%,rgba(255,255,255,.10),transparent 25%,transparent 75%,rgba(255,255,255,.07))}
.gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
@media(max-width:760px){.gamegrid{grid-template-columns:1fr}}
.gcard{
  position:relative;overflow:hidden;cursor:pointer;border-radius:var(--radius);padding:22px 20px 20px;
  background:var(--panel);border:1.5px solid var(--line);box-shadow:var(--shadow);
  transition:transform .16s,border-color .16s;display:flex;flex-direction:column;gap:10px;min-height:210px;
}
.gcard:hover{transform:translateY(-4px)}
.gcard .glow{position:absolute;inset:0;opacity:.0;transition:.2s;background:radial-gradient(360px 200px at 50% -20%,var(--c1),transparent 70%)}
.gcard:hover .glow{opacity:.5}
.gcard .emoji{font-size:40px;line-height:1}
.gcard .stripe{position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.gcard h3{font-size:21px;position:relative}
.gcard p{margin:0;color:var(--ink-3);font-size:13.5px;font-weight:500;position:relative;flex:1}
.gcard .go{position:relative;align-self:flex-start;margin-top:4px;font-weight:800;font-size:13.5px;color:var(--c2);display:inline-flex;align-items:center;gap:6px}
.gcard .tag{position:absolute;top:16px;right:14px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);background:var(--panel-2);border:1px solid var(--line);padding:4px 9px;border-radius:20px}
/* unit selector */
.unitbox{border-radius:var(--radius);padding:20px;background:var(--panel);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.unitbox .head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.unitbox h3{font-size:18px}
.unitbox .head .spacer{flex:1}
.ulink{cursor:pointer;font-weight:700;font-size:13px;color:var(--teal);background:none;border:none;font-family:var(--font-b)}
.ulink:hover{text-decoration:underline}
.uchips{display:flex;flex-wrap:wrap;gap:8px}
.uchip{
  cursor:pointer;user-select:none;font-weight:700;font-size:13px;line-height:1;
  padding:9px 12px;border-radius:11px;border:1.5px solid var(--line-2);
  background:var(--panel-2);color:var(--ink-3);transition:.12s;display:flex;align-items:center;gap:7px;
}
.uchip .em{font-size:15px}
.uchip[data-on="1"]{background:linear-gradient(135deg,rgba(47,224,214,.22),rgba(124,140,255,.18));border-color:var(--teal);color:var(--ink)}
.uchip:hover{transform:translateY(-1px)}
.selcount{font-weight:800;color:var(--ink);font-size:13.5px}
/* ---------- STAGE common ---------- */
.stagehead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stagehead .ttl{display:flex;align-items:center;gap:12px}
.stagehead .mi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc-2));color:var(--acc-ink);box-shadow:0 10px 24px -10px var(--acc)}
.stagehead h2{font-size:22px;line-height:1.05}
.stagehead .sub{font-size:12.5px;color:var(--ink-3);font-weight:600}
.stagehead .spacer{flex:1}
.setup{max-width:560px;margin:4vh auto 0}
.setup .card{padding:26px 22px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:13.5px;color:var(--ink-2);margin-bottom:7px}
.field input,.field select{
  width:100%;font-family:var(--font-b);font-size:15px;font-weight:600;color:var(--ink);
  background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--acc)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{cursor:pointer;font-family:var(--font-b);font-weight:800;font-size:15px;padding:11px 16px;border-radius:12px;
  background:var(--panel-2);border:1.5px solid var(--line-2);color:var(--ink-2);transition:.12s;min-width:52px}
.seg button[data-on="1"]{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:var(--acc-ink);border-color:transparent}
/* ---------- MILLIONAIRE ---------- */
.mi-wrap{--acc:var(--gold);--acc-2:var(--gold-2);--acc-ink:var(--gold-ink)}
.mi-layout{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
@media(max-width:820px){.mi-layout{grid-template-columns:1fr}}
.mi-main{display:flex;flex-direction:column;gap:16px}
.lifelines{display:flex;gap:10px;flex-wrap:wrap}
.lifeline{
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;
  padding:10px 15px;border-radius:40px;border:2px solid var(--gold);color:var(--gold);background:rgba(246,201,69,.08);transition:.15s
}
.lifeline:hover{background:rgba(246,201,69,.18)}
.lifeline.used{opacity:.32;text-decoration:line-through;cursor:not-allowed;border-color:var(--ink-3);color:var(--ink-3);background:transparent}
.qbox{
  border-radius:18px;padding:26px 24px;text-align:center;position:relative;
  background:linear-gradient(135deg,var(--panel-2),var(--panel));border:2px solid var(--gold);
  box-shadow:0 0 0 4px rgba(246,201,69,.08),var(--shadow);
}
.qbox .qnum{font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.qbox .qtext{font-size:clamp(19px,3.2vw,27px);font-weight:700;font-family:var(--font-d);margin:10px 0 2px;line-height:1.25}
.qbox .qtag{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:8px}
.audiorow{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.abtn{font-size:16px;animation:apulse 1.9s ease-in-out infinite}
@keyframes apulse{0%,100%{box-shadow:0 14px 30px -14px var(--acc)}50%{box-shadow:0 14px 34px -8px var(--acc),0 0 0 7px rgba(255,255,255,.07)}}
.reveal-fallback{margin-top:12px;font-size:17px;font-weight:700;color:var(--ink);background:var(--panel-2);border:1.5px dashed var(--line-2);border-radius:12px;padding:10px 14px;display:inline-block}
.listen-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--acc);background:rgba(255,255,255,.06);border:1px solid var(--line-2);padding:4px 11px;border-radius:20px;margin-bottom:4px}
.rankSel{font-family:var(--font-b);font-weight:700;font-size:12.5px;background:var(--panel-2);color:var(--ink);border:1.5px solid var(--line-2);border-radius:9px;padding:6px 9px;cursor:pointer}
.rankwrap{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.answers{grid-template-columns:1fr}}
.ans{
  cursor:pointer;display:flex;align-items:center;gap:13px;text-align:left;
  padding:15px 17px;border-radius:14px;font-size:16.5px;font-weight:600;color:var(--ink);
  background:var(--panel-2);border:2px solid var(--line-2);transition:.14s;font-family:var(--font-b);
}
.ans:hover:not(.locked){border-color:var(--gold);transform:translateY(-1px)}
.ans .lt{font-family:var(--font-d);font-weight:700;color:var(--gold);width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:rgba(246,201,69,.14);border:1.5px solid var(--gold);font-size:15px}
.ans.sel{border-color:var(--gold);background:linear-gradient(135deg,rgba(246,201,69,.22),rgba(255,173,51,.12))}
.ans.correct{border-color:var(--good);background:linear-gradient(135deg,rgba(54,208,138,.28),rgba(31,158,99,.14))}
.ans.correct .lt{background:var(--good);color:#04130c;border-color:var(--good)}
.ans.wrong{border-color:var(--bad);background:linear-gradient(135deg,rgba(251,103,103,.26),rgba(196,58,58,.12))}
.ans.wrong .lt{background:var(--bad);color:#1a0404;border-color:var(--bad)}
.ans.dim{opacity:.25;pointer-events:none}
.ans.locked{cursor:default}
.ladder{border-radius:16px;padding:12px;background:var(--panel);border:1.5px solid var(--line);display:flex;flex-direction:column-reverse;gap:3px}
.rung{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-3)}
.rung .n{font-family:var(--font-d);width:24px;text-align:right;color:var(--ink-3)}
.rung .amt{flex:1;text-align:right}
.rung.mile{color:var(--ink-2)}
.rung.mile .amt{color:var(--gold)}
.rung.on{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--gold-ink)}
.rung.on .n,.rung.on .amt{color:var(--gold-ink)}
.rung.done{color:var(--ink-3);opacity:.6}
.phone-pop,.audience-pop{margin-top:4px;border-radius:14px;padding:16px;background:var(--panel-2);border:1.5px solid var(--gold);font-weight:600}
.audience-bars{display:flex;gap:12px;align-items:flex-end;height:120px;margin-top:10px}
.abar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.abar .bar{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold-2));min-height:4px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.abar .pct{font-family:var(--font-d);font-weight:700;font-size:13px}
.abar .lt{font-weight:800;font-size:13px;color:var(--gold)}
/* win/lose overlay */
.result{text-align:center;max-width:560px;margin:3vh auto 0}
.result .big{font-size:clamp(28px,6vw,46px);font-family:var(--font-d);font-weight:700;margin:6px 0}
.result .prize{font-size:clamp(24px,5vw,38px);color:var(--gold);font-family:var(--font-d);font-weight:700}
/* ---------- OLYMPIA ---------- */
.ol-wrap{--acc:var(--teal);--acc-2:var(--teal-2);--acc-ink:var(--teal-ink)}
.scoreboard{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.team{border-radius:16px;padding:14px;border:2px solid var(--line-2);background:var(--panel);position:relative;overflow:hidden}
.team.active{border-color:var(--teal);box-shadow:0 0 0 4px rgba(47,224,214,.14)}
.team .tp{position:absolute;top:0;left:0;right:0;height:5px}
.team .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.team .sc{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1}
.team .ctrls{display:flex;gap:6px;margin-top:9px}
.team .ctrls button{flex:1;cursor:pointer;font-family:var(--font-d);font-weight:700;font-size:14px;border-radius:9px;padding:6px;border:1.5px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);transition:.12s}
.team .ctrls button:hover{border-color:var(--teal);color:var(--ink)}
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:760px){.rounds{grid-template-columns:1fr 1fr}}
.round{cursor:pointer;border-radius:15px;padding:15px 13px;background:var(--panel);border:1.5px solid var(--line);transition:.15s;text-align:center}
.round:hover{transform:translateY(-3px);border-color:var(--teal)}
.round .em{font-size:28px}
.round .rn{font-weight:800;font-size:14.5px;margin-top:6px;font-family:var(--font-d)}
.round .rd{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:3px}
.round .rv{margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--teal);background:rgba(47,224,214,.12);border:1px solid var(--teal);display:inline-block;padding:3px 9px;border-radius:20px}
.award{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.award button{cursor:pointer;font-family:var(--font-b);font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px;border:2px solid var(--line-2);background:var(--panel-2);color:var(--ink);transition:.12s}
.award button:hover{transform:translateY(-1px)}
.award button.none{border-style:dashed;color:var(--ink-3)}
/* finish round value pick */
.valpick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}
.valpick button{cursor:pointer;font-family:var(--font-d);font-weight:700;font-size:18px;width:66px;height:66px;border-radius:16px;border:2px solid var(--teal);background:rgba(47,224,214,.1);color:var(--teal);transition:.14s}
.valpick button:hover{background:var(--teal);color:var(--teal-ink)}
/* ---------- CROSSWORD ---------- */
.cw-wrap{--acc:var(--mag);--acc-2:var(--mag-2);--acc-ink:var(--mag-ink)}
.cw-scroll{overflow-x:auto;padding-bottom:8px}
.cw-grid{display:inline-flex;flex-direction:column;gap:7px;margin:0 auto;min-width:min-content}
.cw-row{display:flex;align-items:center;gap:7px}
.cw-row .rowno{width:30px;flex:none;font-family:var(--font-d);font-weight:700;color:var(--mag);text-align:center;font-size:15px;cursor:pointer}
.cw-cells{display:flex;gap:4px}
.cell{width:clamp(30px,5.2vw,44px);height:clamp(30px,5.2vw,44px);flex:none;border-radius:8px;display:grid;place-items:center;
  font-family:var(--font-d);font-weight:700;font-size:clamp(15px,3vw,21px);text-transform:uppercase;
  background:var(--panel-2);border:1.8px solid var(--line-2);color:transparent;transition:.2s}
.cell.filled{color:var(--ink);background:var(--panel-3);border-color:var(--line-2)}
.cell.key{border-color:var(--mag);background:rgba(236,114,245,.14)}
.cell.key.filled{background:linear-gradient(135deg,rgba(236,114,245,.4),rgba(177,75,255,.22));color:#fff}
.cell.spacer{background:transparent;border:none}
.cw-clue{flex:1;min-width:150px;font-size:13.5px;color:var(--ink-2);font-weight:600;cursor:pointer;padding:4px 0}
.cw-clue:hover{color:var(--ink)}
.cw-clue .badge{font-weight:800;color:var(--mag);font-family:var(--font-d);margin-right:6px}
.keyword-reveal{margin-top:18px;text-align:center}
.keyword-reveal .kw{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.keyword-reveal .kc{width:clamp(34px,6vw,50px);height:clamp(40px,7vw,58px);border-radius:10px;display:grid;place-items:center;
  font-family:var(--font-d);font-weight:700;font-size:clamp(18px,4vw,28px);text-transform:uppercase;
  background:linear-gradient(135deg,var(--mag),var(--mag-2));color:#fff;box-shadow:0 10px 24px -12px var(--mag)}
.keyword-reveal .kc.hidden{background:var(--panel-2);color:transparent;box-shadow:none;border:1.8px solid var(--mag)}

      {r:"If + hiện tại đơn, S + will + V (nguyên mẫu).",exs:[{en:"If you save money, you will buy it soon.",vi:"Nếu bạn tiết kiệm, bạn sẽ sớm mua được."}]},
      {r:"unless = if … not (trừ khi).",exs:[{en:"Unless you hurry, you will miss the sale.",vi:"Nếu bạn không nhanh, bạn sẽ lỡ đợt giảm giá."}]},
      {r:"Có thể đảo mệnh đề; nếu if đứng đầu thì có dấu phẩy.",exs:[{en:"You will save money if you make a budget.",vi:"Bạn sẽ tiết kiệm nếu bạn lập ngân sách."}]}
    ],
    table:[["Mệnh đề if","If + hiện tại đơn"],["Mệnh đề chính","will / won't + V"],["unless","= if … not (trừ khi)"]],
    tip:"KHÔNG dùng will trong mệnh đề if: If it will rain (SAI) → If it rains (ĐÚNG).",
    practice:[
      {q:"If I save enough, I ___ a new bike.",opts:["buy","will buy","bought"],a:1,why:"Mệnh đề chính → will + V."},
      {q:"If you ___ too much, you will have no money.",opts:["spend","will spend","spent"],a:0,why:"Mệnh đề if → hiện tại đơn."},
      {q:"You will miss the bus ___ you leave now.",opts:["if","unless","when"],a:1,why:"trừ khi → unless."},
      {q:"If it ___ , we won't go shopping.",opts:["rains","will rain","rained"],a:0,why:"if + hiện tại đơn."},
      {q:"She ___ the shoes if they are cheap.",opts:["buys","will buy","bought"],a:1,why:"Mệnh đề chính → will buy."},
      {q:"We won't buy it ___ there is a discount.",opts:["if","unless","when"],a:1,why:"trừ khi có giảm giá → unless."},
      {q:"If you don't keep the receipt, you ___ get a refund.",opts:["won't","don't","aren't"],a:0,why:"Phủ định tương lai → won't."},
      {q:"Chọn câu ĐÚNG:",opts:["If it will rain, we stay home.","If it rains, we will stay home.","If it rains, we stay will home."],a:1,why:"if + hiện tại đơn, chính + will."},
      {q:"I ___ money if I work this summer.",opts:["will earn","earn","earned"],a:0,why:"Mệnh đề chính → will earn."},
      {q:"If you ___ your budget, you will be fine.",opts:["will follow","follow","followed"],a:1,why:"if + hiện tại đơn → follow."},
      {q:"We'll be late ___ we take a taxi.",opts:["if","unless","when"],a:1,why:"trừ khi đi taxi → unless."},
      {q:"If the price ___ lower, I'll buy two.",opts:["is","will be","was"],a:0,why:"if + hiện tại đơn → is."}
    ]}

/* =========================================================================
   PREPARE ARENA — app logic
   COURSE (above) = full syllabus data reused from the class vocabulary app.
   ========================================================================= */
"use strict";
const $=s=>document.querySelector(s);
const stage=$("#stage");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rint=n=>Math.floor(Math.random()*n);
const rpick=a=>a[rint(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
const vnd=t=>(t*1000).toLocaleString('vi-VN')+' đ';

/* ---------------- persistence ---------------- */
function load(k,d){try{const v=localStorage.getItem('pa_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem('pa_'+k,JSON.stringify(v));}catch(e){}}

/* ---------------- state ---------------- */
const ALL_N=COURSE.map(u=>u.n);
let selUnits=load('units',COURSE.filter(u=>u.n!=="0").slice(0,6).map(u=>u.n)); // default first few real units
selUnits=selUnits.filter(n=>ALL_N.includes(n));
if(!selUnits.length) selUnits=["1","2","3"];
let muted=load('muted',false);

/* ---------------- audio ---------------- */
let actx=null;
function ac(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function tone(freq,dur,type,vol,when){ if(muted)return; const c=ac(); if(!c)return;
  const t=c.currentTime+(when||0); const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.18,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.02);
}
const sfx={
  select:()=>tone(520,.09,'triangle',.14),
  correct:()=>{tone(660,.12,'sine',.18);tone(880,.16,'sine',.16,.1);tone(1175,.26,'sine',.16,.2);},
  wrong:()=>{tone(200,.3,'sawtooth',.14);tone(150,.4,'sawtooth',.12,.08);},
  tick:()=>tone(880,.04,'square',.06),
  suspense:()=>{tone(130,.5,'sawtooth',.08);},
  win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.18,i*.13));},
  reveal:()=>tone(740,.14,'triangle',.14),
};
function setMute(m){muted=m;save('muted',m);$("#muteBtn").textContent=m?'🔇':'🔊';}
setMute(muted);
$("#muteBtn").onclick=()=>{setMute(!muted); if(!muted){ac(); sfx.select();}};

/* ---------------- text-to-speech (listening questions) ---------------- */
let voices=[];
function loadVoices(){try{voices=(window.speechSynthesis.getVoices())||[];}catch(e){voices=[];}}
const TTS_OK=(typeof window!=='undefined')&&('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
if(TTS_OK){ loadVoices(); try{window.speechSynthesis.onvoiceschanged=loadVoices;}catch(e){} }
function pickVoice(){
  if(!voices.length)loadVoices();
  return voices.find(v=>/en[-_](US|GB)/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
}
function speak(text,rate){
  if(!TTS_OK||!text)return false;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang='en-US'; u.rate=rate||0.9; u.pitch=1; u.volume=1;
    const v=pickVoice(); if(v)u.voice=v;
    window.speechSynthesis.speak(u); return true;
  }catch(e){return false;}
}
function stopSpeak(){ if(TTS_OK){try{window.speechSynthesis.cancel();}catch(e){}} }

/* ---------------- confetti ---------------- */
const cvs=$("#confetti"),cx=cvs.getContext('2d');let cparts=[],craf=null;
function sizeCvs(){cvs.width=innerWidth;cvs.height=innerHeight;}
addEventListener('resize',sizeCvs);sizeCvs();
function confetti(){
  sizeCvs(); const cols=['#f6c945','#ec72f5','#2fe0d6','#7c8cff','#36d08a','#ffad33'];
  cparts=[]; for(let i=0;i<150;i++)cparts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*0.35,
    vx:(Math.random()-.5)*11,vy:-Math.random()*13-3,g:.32+Math.random()*.15,
    s:6+Math.random()*7,c:rpick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});
  if(craf)cancelAnimationFrame(craf); const t0=performance.now();
  (function run(t){ cx.clearRect(0,0,cvs.width,cvs.height); let alive=false;
    cparts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
      if(p.y<cvs.height+40){alive=true; cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
        cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,1-(t-t0)/2600);
        cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();}});
    if(alive&&t-t0<2800)craf=requestAnimationFrame(run); else cx.clearRect(0,0,cvs.width,cvs.height);
  })(t0);
}

/* ---------------- toast ---------------- */
let toT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add('show');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------------- pools & question generators ---------------- */
function pool(){
  const units=COURSE.filter(u=>selUnits.includes(u.n));
  const vocab=[],grammar=[];
  units.forEach(u=>{
    (u.vocab||[]).forEach(w=>vocab.push({en:w.en,vi:w.vi,pos:w.pos||'',ex:w.ex||'',emoji:w.emoji||'',un:u.n,ut:u.title}));
    ((u.grammar&&u.grammar.practice)||[]).forEach(p=>grammar.push({q:p.q,opts:p.opts,a:p.a,why:p.why||'',un:u.n,ut:u.title,gt:(u.grammar.point||'')}));
  });
  return {units,vocab,grammar};
}
function distractors(list,field,correct,k,pos){
  let cand=list.filter(x=>x[field]&&x[field]!==correct);
  if(pos){const same=cand.filter(x=>x.pos===pos); if(same.length>=k)cand=same;}
  // unique by field
  const seen=new Set([correct]);const out=[];
  for(const x of shuffle(cand)){ if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field]); if(out.length>=k)break;} }
  while(out.length<k)out.push('—'+(out.length));
  return out;
}
function mkChoice(correct,distrs){
  const opts=shuffle([correct,...distrs]); return {opts,a:opts.indexOf(correct)};
}
function blankEx(ex,word){
  const w=word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('\\b'+w+'\\b','i'); if(!re.test(ex))return null;
  return ex.replace(re,'______');
}
// Build a 4-option vocab question of a given mode for word w. Returns null if impossible.
function vocabQ(w,mode,vocab){
  if(mode==='e2v'){const c=mkChoice(w.vi,distractors(vocab,'vi',w.vi,3));
    return {q:`Từ <b>"${esc(w.en)}"</b> có nghĩa là gì?`,opts:c.opts.map(esc),a:c.a,tag:`Nghĩa của từ · Unit ${w.un}`,why:w.ex?('VD: '+w.ex):''};}
  if(mode==='v2e'){const c=mkChoice(w.en,distractors(vocab,'en',w.en,3,w.pos));
    return {q:`Từ tiếng Anh nào có nghĩa là <b>"${esc(w.vi)}"</b>?`,opts:c.opts.map(esc),a:c.a,tag:`Chọn từ · Unit ${w.un}`,why:w.ex?('VD: '+w.ex):''};}
  if(mode==='gap'){const b=blankEx(w.ex,w.en); if(!b)return null;
    const c=mkChoice(w.en,distractors(vocab,'en',w.en,3,w.pos));
    return {q:`Điền từ còn thiếu:<br><span style="color:var(--ink-2);font-weight:600">${esc(b)}</span>`,opts:c.opts.map(esc),a:c.a,tag:`Điền từ · Unit ${w.un}`,why:`Nghĩa: ${esc(w.vi)}`};}
  return null;
}
function grammarQ(g){return {q:esc(g.q).replace(/_{2,}/g,'______'),opts:g.opts.map(esc),a:g.a,tag:`Ngữ pháp · Unit ${g.un}`,why:g.why?esc(g.why):''};}

/* ---------------- LISTENING question generators (TTS) ---------------- */
function pickWord(P,needEx){
  let list=P.vocab;
  if(needEx)list=P.vocab.filter(w=>w.ex&&blankEx(w.ex,w.en));
  return list.length?list[rint(list.length)]:null;
}
function misspell(word,n){
  const base=word.toLowerCase();
  if(base.includes(' ')||base.length<3)return [];
  const vowels='aeiou'; const out=new Set(); let tries=0;
  const ops=[
    s=>{const c=s.split('');const i=rint(c.length-1);[c[i],c[i+1]]=[c[i+1],c[i]];return c.join('');},
    s=>{const i=rint(s.length);return s.slice(0,i)+s[i]+s.slice(i);},
    s=>{if(s.length<=3)return s;const i=rint(s.length);return s.slice(0,i)+s.slice(i+1);},
    s=>{const idx=[...s].map((c,i)=>vowels.includes(c)?i:-1).filter(i=>i>=0);if(!idx.length)return s;const i=rpick(idx);const v=rpick(vowels.split('').filter(x=>x!==s[i]));return s.slice(0,i)+v+s.slice(i+1);}
  ];
  while(out.size<n&&tries<50){tries++;const m=rpick(ops)(base);if(m!==base&&!out.has(m)&&m.length>=2)out.add(m);}
  return [...out].slice(0,n);
}
function listenWordMeaning(P){const w=pickWord(P);if(!w)return null;
  const c=mkChoice(w.vi,distractors(P.vocab,'vi',w.vi,3));
  return {q:'🔊 <b>Nghe</b> rồi chọn <b>nghĩa đúng</b> của từ em vừa nghe:',opts:c.opts.map(esc),a:c.a,
    tag:`Nghe · Unit ${w.un}`,why:`Từ: <b>${esc(w.en)}</b> — ${esc(w.vi)}`,
    audio:w.en,audioRate:.8,audioOnly:true,revealText:`Từ: <b>${esc(w.en)}</b>`};}
function listenSpelling(P){if(!TTS_OK)return null;const w=pickWord(P);if(!w)return null;
  const miss=misspell(w.en,3);if(miss.length<3)return null;
  const c=mkChoice(w.en,miss);
  return {q:'🔊 <b>Nghe</b> rồi chọn <b>cách viết đúng</b> của từ:',opts:c.opts.map(esc),a:c.a,
    tag:`Nghe · Chính tả · Unit ${w.un}`,why:`Nghĩa: ${esc(w.vi)}`,
    audio:w.en,audioRate:.78,audioOnly:true};}
function listenSentenceGap(P){const w=pickWord(P,true);if(!w)return null;
  const b=blankEx(w.ex,w.en);const c=mkChoice(w.en,distractors(P.vocab,'en',w.en,3,w.pos));
  return {q:'🔊 <b>Nghe cả câu</b> rồi chọn <b>từ còn thiếu</b>:<br><span style="color:var(--ink-2);font-weight:600">'+esc(b)+'</span>',
    opts:c.opts.map(esc),a:c.a,tag:`Nghe · Điền từ · Unit ${w.un}`,why:`Nghĩa: ${esc(w.vi)}`,
    audio:w.ex,audioRate:.9};}
function listenPickSentence(P){if(!TTS_OK)return null;const w=pickWord(P,true);if(!w)return null;
  const re=new RegExp('\\b'+w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
  const others=distractors(P.vocab,'en',w.en,3,w.pos);
  const wrongs=others.map(o=>w.ex.replace(re,o)).filter(s=>s!==w.ex);
  if(wrongs.length<3)return null;
  const c=mkChoice(w.ex,wrongs.slice(0,3));
  return {q:'🔊 <b>Nghe cả câu</b> rồi chọn <b>đúng câu em vừa nghe</b>:',opts:c.opts.map(esc),a:c.a,
    tag:`Nghe · Chọn câu · Unit ${w.un}`,why:`Câu đúng: “${esc(w.ex)}”`,
    audio:w.ex,audioRate:.92,audioOnly:true};}
function listenPickWord(P){if(!TTS_OK)return null;const w=pickWord(P);if(!w)return null;
  const c=mkChoice(w.en,distractors(P.vocab,'en',w.en,3,w.pos));
  return {q:'🔊 <b>Nghe</b> rồi chọn <b>đúng từ tiếng Anh</b> em vừa nghe:',opts:c.opts.map(esc),a:c.a,
    tag:`Nghe · Chọn từ · Unit ${w.un}`,why:`Từ: <b>${esc(w.en)}</b> — ${esc(w.vi)}`,
    audio:w.en,audioRate:.82,audioOnly:true};}

/* ---------------- typed question factory & mixed decks ---------------- */
function genByKind(kind,P){
  if(kind==='e2v'||kind==='v2e'||kind==='gap'){const w=pickWord(P,kind==='gap');if(!w)return null;return vocabQ(w,kind,P.vocab);}
  if(kind==='grammar'){if(!P.grammar.length)return null;return grammarQ(P.grammar[rint(P.grammar.length)]);}
  if(kind==='lmean')return listenWordMeaning(P);
  if(kind==='lspell')return listenSpelling(P);
  if(kind==='lgap')return listenSentenceGap(P);
  if(kind==='lsent')return listenPickSentence(P);
  if(kind==='lword')return listenPickWord(P);
  return null;
}
const MIX={
  warm:{e2v:2,v2e:2,gap:1,grammar:3,lmean:2,lword:1,lgap:1,lsent:1},
  fast:{v2e:1,gap:1,grammar:4,lgap:1,lword:1,lspell:1,lsent:2,lmean:1},
  hard:{gap:1,grammar:4,lsent:3,lword:1,lspell:1,lgap:1}
};
function weightedKinds(mix){const a=[];for(const k in mix)for(let i=0;i<mix[k];i++)a.push(k);return a;}
function drawTyped(mix,n){
  const P=pool();if(!P.vocab.length)return [{q:'Chưa có câu hỏi — hãy chọn ít nhất một Unit.',opts:['OK'],a:0,tag:'',why:''}];
  const bag=weightedKinds(mix);const out=[];
  for(let i=0;i<n;i++){let q=null,tries=0;
    while(!q&&tries<60){tries++;q=genByKind(rpick(bag),P);}
    if(!q)q=genByKind('v2e',P)||genByKind('e2v',P);
    if(q)out.push(q);
  }
  return out.length?out:[{q:'Chưa có câu hỏi.',opts:['OK'],a:0,tag:'',why:''}];
}

function audioPromptHTML(q){

}

/* ---------------- CROSSWORD ENGINE ---------------- */
function makeCrossword(vocab,keywordRaw){
  const KW=String(keywordRaw||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(!KW)return null;
  const clean=w=>w.toUpperCase().replace(/[^A-Z]/g,'');
  const rows=[]; const used=new Set();
  for(let i=0;i<KW.length;i++){
    const L=KW[i];
    let cand=vocab.filter(w=>{const s=clean(w.en);return s.length>=3&&s.length<=11&&s.includes(L)&&!used.has(s);});
    if(!cand.length)cand=vocab.filter(w=>{const s=clean(w.en);return s.includes(L)&&!used.has(s);});
    if(!cand.length)cand=vocab.filter(w=>clean(w.en).includes(L));
    if(!cand.length){ // letter not in any vocab: make a filler row
      rows.push({answer:L,clue:'(ký tự đặc biệt)',keyPos:0,display:L}); continue; }
    const pickW=rpick(cand); const s=clean(pickW.en);
    // choose occurrence of L closest to middle
    const occ=[]; for(let k=0;k<s.length;k++)if(s[k]===L)occ.push(k);
    const mid=(s.length-1)/2; occ.sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid));
    used.add(s);
    rows.push({answer:s,clue:pickW.vi,keyPos:occ[0],display:pickW.en,un:pickW.un});
  }
  const keyCol=Math.max(...rows.map(r=>r.keyPos));
  rows.forEach(r=>r.offset=keyCol-r.keyPos);
  const width=Math.max(...rows.map(r=>r.offset+r.answer.length));
  return {keyword:KW,keyCol,width,rows};
}

   ====================================================================== */
const MI=(function(){
  const LADDER=[200,400,600,1000,2000,3000,6000,10000,14000,22000,30000,40000,60000,85000,150000];
  const MILES=[4,9,14]; // safe levels (0-indexed question) -> guaranteed after passing
  let qs=[],idx=0,sel=-1,locked=false,answered=false,lifelines={},removed=[];
  function build(){
    const P=pool(); qs=[];
    // difficulty ramp: easy (vocab + nghe nghĩa) → medium (điền/ngữ pháp/nghe) → hard (ngữ pháp/nghe câu/chính tả)
    const tiers=[
      ['e2v','v2e','lmean','lword','v2e'],
      ['gap','grammar','grammar','lgap','lword','lmean','lsent'],
      ['grammar','grammar','lsent','lsent','gap','lspell','lword']
    ];
    for(let i=0;i<15;i++){
      const tier=i<5?0:i<10?1:2; let q=null,tries=0;
      while(!q&&tries<70){tries++; q=genByKind(rpick(tiers[tier]),P);}
      if(!q)q=genByKind('v2e',P)||genByKind('e2v',P)||{q:'—',opts:['A','B','C','D'],a:0,tag:'',why:''};
      qs.push(q);
    }
    idx=0;sel=-1;locked=false;answered=false;removed=[];
    lifelines={fifty:false,phone:false,audience:false};
  }
  function guaranteed(){let g=0;for(const m of MILES){if(idx>m)g=LADDER[m];}return g;}
  function ladderHTML(){
    let h='';
    for(let i=0;i<15;i++){
      const cls=['rung']; if(MILES.includes(i))cls.push('mile');
      if(i===idx)cls.push('on'); else if(i<idx)cls.push('done');
      h+=`<div class="${cls.join(' ')}"><span class="n">${i+1}</span><span class="amt">${vnd(LADDER[i])}</span>${MILES.includes(i)?'<span style="font-size:11px">🔒</span>':''}</div>`;
    }
    return `<div class="ladder">${h}</div>`;
  }
  function render(){
    const q=qs[idx]; const letters=['A','B','C','D','E'];
    stage.innerHTML=`<div class="mi-wrap">
      ${headHTML('💰','Ai là triệu phú','Câu '+(idx+1)+'/15 · Nấc an toàn: '+(guaranteed()?vnd(guaranteed()):'chưa có'))}
      <div class="mi-layout">
        <div class="mi-main">
          <div class="lifelines">
            <div class="lifeline ${lifelines.fifty?'used':''}" data-l="fifty">50:50</div>
            <div class="lifeline ${lifelines.phone?'used':''}" data-l="phone">📞 Gọi điện</div>
            <div class="lifeline ${lifelines.audience?'used':''}" data-l="audience">👥 Hỏi khán giả</div>
          </div>
          <div id="helperPop"></div>
          <div class="qbox">
            <div class="qnum">Câu hỏi ${idx+1} — ${esc((q.tag||'').split('·')[0].trim())||'A2'}</div>
            ${audioPromptHTML(q)}
          </div>
          <div class="answers" id="answers">
            ${q.opts.map((o,i)=>`<div class="ans" data-i="${i}"><span class="lt">${letters[i]}</span><span>${o}</span></div>`).join('')}
          </div>
          <div class="rowbtns center" style="justify-content:center">
            <button class="btn" id="lockBtn" disabled>🔒 Chốt đáp án</button>
          </div>
        </div>
        <div>${ladderHTML()}</div>
      </div>
    </div>`;
    $("#backHome").onclick=()=>go('home');
    const ansEls=[...stage.querySelectorAll('.ans')];
    ansEls.forEach(a=>a.onclick=()=>{ if(locked||answered)return; if(removed.includes(+a.dataset.i))return;
      sel=+a.dataset.i; ansEls.forEach(x=>x.classList.remove('sel')); a.classList.add('sel');
      $("#lockBtn").disabled=false; sfx.select();
    });
    removed.forEach(i=>ansEls[i]&&ansEls[i].classList.add('dim'));
    $("#lockBtn").onclick=lockIn;
    stage.querySelectorAll('.lifeline').forEach(l=>l.onclick=()=>useLifeline(l.dataset.l));
    bindAudio(q);
  }
  function lockIn(){
    if(sel<0||locked)return; locked=true; answered=true; const q=qs[idx];
    $("#lockBtn").disabled=true; sfx.suspense(); stopSpeak();
    const ansEls=[...stage.querySelectorAll('.ans')];
    ansEls.forEach(a=>a.classList.add('locked'));
    setTimeout(()=>{
      const ok=sel===q.a;
      ansEls[sel].classList.add(ok?'correct':'wrong');
      if(!ok)ansEls[q.a].classList.add('correct');
      if(q.why){const p=$("#helperPop");p.innerHTML=`<div class="phone-pop">💡 ${q.why}</div>`;}
      if(ok){sfx.correct(); setTimeout(next,1500);}
      else {sfx.wrong(); setTimeout(()=>lose(),1600);}
    },1400);
  }
  function next(){ if(idx>=14){win();return;} idx++;sel=-1;locked=false;answered=false;removed=[];render(); }
  function useLifeline(l){
    if(lifelines[l])return; const q=qs[idx]; lifelines[l]=true;
    const el=stage.querySelector('.lifeline[data-l="'+l+'"]'); el&&el.classList.add('used'); sfx.reveal();
    if(l==='fifty'){
      const wrong=q.opts.map((_,i)=>i).filter(i=>i!==q.a);
      removed=shuffle(wrong).slice(0,Math.max(0,q.opts.length-2));

    }else if(l==='phone'){
      const right=Math.random()<.78; const pick=right?q.a:rpick(q.opts.map((_,i)=>i).filter(i=>!removed.includes(i)));
      const L=['A','B','C','D'][pick];
      const msg=right?`Mình khá chắc là đáp án <b>${L}</b> đó!`:`Ờm... mình không chắc lắm, nhưng chắc là <b>${L}</b>?`;
      $("#helperPop").innerHTML=`<div class="phone-pop">📞 Người thân: “${msg}”</div>`;
    }else if(l==='audience'){
      const avail=q.opts.map((_,i)=>i).filter(i=>!removed.includes(i));
      const pcts={}; let rem=100; const bias=rint(25)+45; // correct gets 45-70%
      pcts[q.a]=bias; rem-=bias;
      const others=avail.filter(i=>i!==q.a);
      others.forEach((i,k)=>{ const v=k===others.length-1?rem:rint(rem); pcts[i]=v; rem-=v; });
      const bars=avail.map(i=>`<div class="abar"><div class="pct">${pcts[i]||0}%</div><div class="bar" style="height:0" data-h="${(pcts[i]||0)}"></div><div class="lt">${['A','B','C','D'][i]}</div></div>`).join('');

      setTimeout(()=>stage.querySelectorAll('.abar .bar').forEach(b=>b.style.height=(b.dataset.h*1.3)+'px'),50);
    }
  }

      function showKw(){const sc=$(".cw-scroll");sc.innerHTML=cwGridHTML(cw,open)+keywordHTML(cw,true);
        $("#revealKw").style.display='none';
        $("#awardRow").innerHTML=`<div class="center muted mt8" style="font-weight:700">🔐 MẬT MÃ đã mở — thưởng +${KW_BONUS} cho đội giải đúng:</div><div class="award">${teams.map((t,i)=>`<button data-t="${i}" style="border-color:${t.c[0]}">${esc(t.name)} +${KW_BONUS}</button>`).join('')}<button class="none" data-t="-1">Không ai</button></div>`;
        $("#awardRow").querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;if(t>=0){teams[t].score+=KW_BONUS;refreshScores();sfx.correct();toast(teams[t].name+' +'+KW_BONUS);}else sfx.tick();$("#awardRow").innerHTML='';});}
    };
    draw();
  }
  // ---- finish (về đích) ----
  function finishPick(){
    stage.innerHTML=`<div class="ol-wrap">${roundHead('Về đích','Đội '+esc(teams[active].name)+' đang chơi (đổi ở bảng điểm). Chọn mức điểm.')}
      ${scoreboardHTML()}
      <div class="card center" style="padding:22px">
        <div class="muted" style="font-weight:700">Chọn gói điểm cho lượt về đích:</div>
        <div class="valpick">${[10,20,30].map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:700;margin-top:10px;cursor:pointer">
          <input type="checkbox" id="starChk" style="width:18px;height:18px"> ⭐ Ngôi sao hy vọng (đúng ×2, sai bị trừ)</label>
      </div></div>`;
    $("#toBoard").onclick=()=>board(); bindBoard();
    stage.querySelectorAll('.valpick button').forEach(b=>b.onclick=()=>{pendingVal=+b.dataset.v;star=$("#starChk").checked;sfx.select();finishQ();});
  }
  function finishQ(){
    const q=drawTyped(MIX.hard,1)[0]; const letters=['A','B','C','D'];
    stage.innerHTML=`<div class="ol-wrap">${roundHead('Về đích · '+esc(teams[active].name),pendingVal+' điểm'+(star?' · ⭐ Ngôi sao (×2 / trừ điểm)':''))}
      ${scoreboardHTML()}
      <div class="qbox" style="border-color:var(--teal);box-shadow:0 0 0 4px rgba(47,224,214,.08),var(--shadow)">
        <div class="qnum" style="color:var(--teal)">${esc(q.tag)}</div>${audioPromptHTML(q)}</div>
      <div class="answers">${q.opts.map((o,i)=>`<div class="ans" style="cursor:default"><span class="lt" style="color:var(--teal);background:rgba(47,224,214,.14);border-color:var(--teal)">${letters[i]}</span><span>${o}</span></div>`).join('')}</div>
      <div class="rowbtns center mt16" style="justify-content:center"><button class="btn" id="rev">👁️ Hiện đáp án</button></div>
      <div id="judge"></div></div>`;
    $("#toBoard").onclick=()=>{stopSpeak();board();}; bindBoard(); bindAudio(q);
    $("#rev").onclick=()=>{const ans=[...stage.querySelectorAll('.ans')];ans[q.a].classList.add('correct');sfx.reveal();$("#rev").style.display='none';
      if(q.why)$("#judge").innerHTML=`<div class="phone-pop" style="border-color:var(--teal);max-width:560px;margin:8px auto 10px">💡 ${q.why}</div>`;
      $("#judge").insertAdjacentHTML('beforeend',`<div class="award"><button data-ok="1" style="border-color:var(--good)">✅ ${esc(teams[active].name)} đúng (+${star?pendingVal*2:pendingVal})</button><button data-ok="0" style="border-color:var(--bad)">❌ Sai (${star?'−'+pendingVal:'0'})</button></div>`);
      $("#judge").querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='1';
        if(ok){teams[active].score+=star?pendingVal*2:pendingVal;sfx.correct();confetti();toast(teams[active].name+' +'+(star?pendingVal*2:pendingVal));}
        else{if(star)teams[active].score-=pendingVal;sfx.wrong();toast(star?teams[active].name+' −'+pendingVal:'Không được điểm');}
        board();});
    };
  }
  function finalScreen(){
    const rank=teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
    confetti();sfx.win();
    stage.innerHTML=`<div class="ol-wrap"><div class="result card" style="padding:28px;max-width:620px">
      <div class="emoji" style="font-size:50px">🏆</div><div class="eyebrow">Chung cuộc</div>
      <div class="big">${esc(rank[0].name)} vô địch!</div>
      <div class="mt16" style="display:flex;flex-direction:column;gap:9px">
      ${rank.map((t,k)=>`<div style="display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:12px;padding:11px 15px">
        <span class="tnum" style="font-size:20px;width:30px">${['🥇','🥈','🥉'][k]||(k+1)}</span>
        <span style="width:10px;height:26px;border-radius:5px;background:linear-gradient(180deg,${t.c[0]},${t.c[1]})"></span>
        <b style="flex:1;text-align:left">${esc(t.name)}</b><span class="tnum" style="font-size:24px;font-weight:700;color:var(--teal)">${t.score}</span></div>`).join('')}
      </div>
      <div class="rowbtns center mt24" style="justify-content:center"><button class="btn" id="bk">↩ Bảng điểm</button> <button class="btn sec" id="hm">Trang chủ</button></div>
      </div></div>`;
    $("#bk").onclick=()=>board();$("#hm").onclick=()=>go('home');
  }
  return {start};
})();

/* ======================================================================
   GAME 3 — Ô CHỮ BÍ MẬT (shared crossword renderer below)
   ====================================================================== */
function cwGridHTML(cw,_open){
  let rows='';
  cw.rows.forEach((r,ri)=>{
    const open=r.open;
    let cells='';
    for(let c=0;c<cw.width;c++){
      const inWord=c>=r.offset&&c<r.offset+r.answer.length;
      if(!inWord){cells+=`<div class="cell spacer"></div>`;continue;}
      const li=c-r.offset; const isKey=(c===cw.keyCol);
      const ch=r.answer[li];
      const cls=['cell']; if(isKey)cls.push('key'); if(open)cls.push('filled');
      cells+=`<div class="${cls.join(' ')}">${open?esc(ch):''}</div>`;
    }
    rows+=`<div class="cw-row">
      <div class="rowno" data-row="${ri}" title="Mở hàng ${ri+1}">${ri+1}</div>
      <div class="cw-cells">${cells}</div>
      <div class="cw-clue" data-row="${ri}"><span class="badge">${ri+1}.</span>${esc(r.clue)} <span class="muted">(${r.answer.length} chữ)</span></div>
    </div>`;
  });
  return `<div class="cw-grid">${rows}</div>`;
}
function keywordHTML(cw,reveal){
  return `<div class="keyword-reveal"><div class="eyebrow" style="color:var(--mag)">🔐 Mật mã</div>
    <div class="kw">${[...cw.keyword].map(ch=>`<div class="kc ${reveal?'':'hidden'}">${reveal?esc(ch):''}</div>`).join('')}</div></div>`;
}
const CW=(function(){
  const KEYWORDS=['PREPARE','ENGLISH','SUCCESS','STUDENT','LEARNING','FRIENDS','SCHOOL','FUTURE','HEALTHY','PLANET','TRAVEL','SPORT','SCIENCE','TEACHER','HOLIDAY','WEEKEND','PROJECT','LIBRARY','CAREFUL','DISCOVER','FESTIVAL','CHAMPION','ADVENTURE','WELCOME','PROGRESS'];
  let cw=null,kwRevealed=false;
  function start(){ if(!requireUnits())return; setAccent('cw'); setup(); }
  function setup(){
    const suggest=rpick(KEYWORDS);
    stage.innerHTML=`<div class="cw-wrap">
      ${headHTML('🔐','Ô chữ bí mật','Giải các hàng ngang để tìm mật mã ở cột dọc')}
      <div class="setup"><div class="card">
        <div class="field"><label>Mật mã (từ khóa cột dọc)</label>
          <input id="kwIn" value="${suggest}" maxlength="12" style="text-transform:uppercase;letter-spacing:.1em;font-family:var(--font-d)">
          <div class="muted" style="font-size:12px;margin-top:6px">Gõ 1 từ tiếng Anh (hoặc mật mã riêng của lớp). Các hàng ngang sẽ tự lấy từ vựng unit đã chọn.</div>
        </div>
        <div class="field"><label>Gợi ý nhanh</label><div class="uchips" id="kwSuggest">${sample(KEYWORDS,6).map(k=>`<div class="uchip" data-k="${k}" data-on="0">${k}</div>`).join('')}</div></div>
        <button class="btn" id="gen" style="width:100%">✨ Tạo ô chữ</button>
      </div></div></div>`;
    $("#backHome").onclick=()=>go('home');
    stage.querySelectorAll('#kwSuggest .uchip').forEach(c=>c.onclick=()=>{$("#kwIn").value=c.dataset.k;sfx.tick();});
    $("#gen").onclick=()=>{const kw=($("#kwIn").value||'').trim();if(kw.replace(/[^a-zA-Z]/g,'').length<2){toast('Mật mã cần ít nhất 2 chữ cái.');return;}
      cw=makeCrossword(pool().vocab,kw);kwRevealed=false;sfx.select();render();};
  }
  function render(){
    stage.innerHTML=`<div class="cw-wrap">
      ${headHTML('🔐','Ô chữ bí mật',cw.rows.length+' hàng ngang · bấm hàng để mở đáp án')}
      <div class="card" style="padding:18px 14px"><div class="cw-scroll" id="cwScroll">${cwGridHTML(cw)}${keywordHTML(cw,false)}</div></div>
      <div class="center mt16">
        <button class="btn sec" id="showAll">👁️ Hiện tất cả hàng</button>
        <button class="btn" id="showKw">🔓 Hiện mật mã</button>
        <button class="btn sec" id="newKw">🔄 Ô chữ mới</button>
        <button class="btn sec" id="change">✏️ Đổi mật mã</button>
      </div></div>`;
    $("#backHome").onclick=()=>go('home');
    bindRows();
    $("#showAll").onclick=()=>{cw.rows.forEach(r=>r.open=true);sfx.reveal();redraw();};
    $("#showKw").onclick=()=>{kwRevealed=true;cw.rows.forEach(r=>r.open=true);sfx.win();confetti();redraw();};
    $("#newKw").onclick=()=>{cw=makeCrossword(pool().vocab,rpick(KEYWORDS));kwRevealed=false;sfx.select();render();};
    $("#change").onclick=()=>setup();
  }
  function redraw(){const sc=$("#cwScroll");sc.innerHTML=cwGridHTML(cw)+keywordHTML(cw,kwRevealed);bindRows();}
  function bindRows(){stage.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>{const r=+el.dataset.row;cw.rows[r].open=!cw.rows[r].open;sfx.reveal();
    if(cw.rows.every(x=>x.open)&&!kwRevealed){kwRevealed=true;confetti();sfx.win();}redraw();});}
  return {start,KEYWORDS};
})();

/* ---------------- boot ---------------- */
go('home');
</script>
